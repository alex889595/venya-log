<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181818">
<title>Веня — журнал</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=64">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Веня <em>/ діабет відмітки</em><span class="env" id="env" hidden>DEV</span></h1>
      <div class="now" id="now"></div>
    </div>
  </header>
  <main id="main"></main>
  <aside class="side" id="side"></aside>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button role="tab" data-view="glucose" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      Журнал</button>
    <button role="tab" data-view="urine" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M6 4h12l-1.2 14a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8z"/><path d="M9 9h6"/></svg>
      Лоток</button>
    <button class="fab" id="addBtn" aria-label="Новий запис">＋</button>
    <button role="tab" data-view="cycles" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-8 4 5"/></svg>
      Зведення</button>
    <button role="tab" data-view="more" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      Ще</button>
  </nav>
  <button class="jump" id="jumpBtn" hidden>до найновіших</button>
  <div class="banner" id="banner" hidden></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Запис"><div id="sheetBody"></div></div>

<script src="config.js?v=64"></script>
<script src="api.js?v=64"></script>
<script src="app.js?v=64"></script>
</body>
</html>
